name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      NX_DAEMON: 'false'
      NX_PARALLEL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - run: corepack enable

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: yarn install --immutable

      - name: Verify source, tooling, documentation and package output
        run: yarn run verify

      - name: Typecheck Angular projects
        run: yarn typecheck

      - name: Build the Angular consumer fixture
        run: yarn nx run fixture-ng22:build

      - name: Require reproducible checked-in output
        run: |
          git status --short
          git diff --stat
          test -z "$(git status --porcelain)"
