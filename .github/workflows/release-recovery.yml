# Resumes or recovers the retained release-metadata candidate of a release run.
# See "Recover the retained run" in .docs/guides/releases.md.
name: Recover ngpel release metadata

on:
  workflow_run:
    workflows: [CI, Release ngpel packages]
    types: [completed]
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  resume-release:
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.repository_id == '1447827206' && github.event.workflow_run.name ==
      'CI' &&
          github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'release/ngpel/') &&
          github.event.workflow_run.head_repository.id == github.event.repository.id) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-metadata-resume
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resume only the retained candidate after its bounded metadata wait
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: resume
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node infra/nx-plugins/src/executors/release/runReleaseAutomation.mjs

  recover-release-metadata:
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.repository_id == '1447827206' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
           github.event.workflow_run.name == 'Release ngpel packages')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-metadata-resume
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Recover only the current retained metadata candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: recover
        run: node infra/nx-plugins/src/executors/release/runReleaseAutomation.mjs
