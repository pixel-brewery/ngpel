name: Merge verified Dependabot updates

on:
  workflow_run:
    workflows: [CI, Release ngpel packages]
    types: [completed]
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  merge:
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.repository_id == '1447827206' &&
          github.event.workflow_run.name == 'CI' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.id == github.event.repository.id) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    concurrency:
      group: dependabot-merge-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      # Run the default-branch helper without PR code, dependency installation or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Merge only the unchanged Dependabot head after every required job succeeds
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPENDABOT_MODE: merge
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node infra/nx-plugins/src/executors/dependabot/runDependabotAutomation.mjs

  request-release:
    needs:
      - merge
      - reconcile
    if: ${{ always() && (needs.merge.outputs.merge_sha != '' || needs.reconcile.outputs.merge_sha != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dependency-release-${{ needs.merge.outputs.merge_sha || needs.reconcile.outputs.merge_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # Retain the successful merge output when retrying a failed release request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Request the release for the retained merge source
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT_SHA: ${{ needs.merge.outputs.merge_sha }}
          DEPENDABOT_MODE: continue
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RECONCILE_MERGE_SHA: ${{ needs.reconcile.outputs.merge_sha }}
        run: node infra/nx-plugins/src/executors/dependabot/runDependabotAutomation.mjs

  reconcile:
    if: ${{ github.ref == 'refs/heads/main' && (github.repository_id == '1447827206') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dependabot-reconcile-${{ github.repository_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Refresh stale dependency branches and request their read-only verification
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPENDABOT_MODE: reconcile
        run: node infra/nx-plugins/src/executors/dependabot/runDependabotAutomation.mjs
        id: reconcile
    outputs:
      merge_sha: ${{ steps.reconcile.outputs.merge_sha }}

  resume-release:
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.repository_id == '1447827206' && github.event.workflow_run.name ==
      'CI' &&
          github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'release/ngpel/') &&
          github.event.workflow_run.head_repository.id == github.event.repository.id) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-metadata-resume
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resume only the retained candidate after its bounded metadata wait
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: resume
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node infra/nx-plugins/src/executors/release/runReleaseAutomation.mjs

  recover-release-metadata:
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.repository_id == '1447827206' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
           github.event.workflow_run.name == 'Release ngpel packages')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-metadata-resume
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Recover only the current retained metadata candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: recover
        run: node infra/nx-plugins/src/executors/release/runReleaseAutomation.mjs
  authorize:
    if: |-
      ${{ github.repository_id == '1447827206' && github.ref == 'refs/heads/main' &&
          (github.event_name != 'workflow_run' ||
           (github.event.workflow_run.name == 'CI' && github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.conclusion == 'action_required' &&
            github.event.workflow_run.head_repository.id == 1447827206)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dependabot-authorize-${{ github.repository_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Authorize only the current source-proven read-only native CI
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DEPENDABOT_MODE: authorize
        run: node infra/nx-plugins/src/executors/dependabot/runDependabotAutomation.mjs
