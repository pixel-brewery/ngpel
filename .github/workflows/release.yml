# cspell:ignore ETARGET nullglob pipefail shopt
name: Publish Packages

on:
  public:
  workflow_dispatch:
    inputs:
      specifier:
        description: Version increment prepared on main
        type: choice
        default: patch
        options: [patch, minor, major]
      version:
        description: Exact version already prepared on main, if supplied
        type: string

permissions: {}

concurrency:
  group: ngpel-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      ${{ github.repository == 'pixel-brewery/ngpel' && github.event.repository.id == 1447827206 &&
          github.event.repository.private == false && github.ref == 'refs/heads/main' &&
          (github.event_name != 'public' || github.sha == vars.NGPEL_LAUNCH_SHA) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require a coordinated version and a successful main CI run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_SPECIFIER: ${{ inputs.specifier || 'patch' }}
        run: |
          set -euo pipefail
          version=$(node --input-type=module -e '
            import { workspacePackages } from "./tools/workspace-packages.mjs";
            const versions = new Set(workspacePackages().map((pkg) => pkg.manifest.version));
            const [version] = versions;
            if (versions.size !== 1 || !/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
              throw new Error("All packages must use the same stable release version.");
            }
            console.log(version);
          ')
          previous=$(git tag --merged "$GITHUB_SHA" --list 'v[0-9]*' --sort=-version:refname | sed -n '1p')
          if [ -n "$REQUESTED_VERSION" ]; then
            test "$REQUESTED_VERSION" = "$version"
          elif [ -n "$previous" ] && [ "$previous" != "v$version" ]; then
            node --input-type=module -e '
              const [before, after] = process.argv.slice(1);
              const next = before.slice(1).split(".").map(Number);
              const index = ["major", "minor", "patch"].indexOf(process.env.RELEASE_SPECIFIER);
              if (index < 0 || next.length !== 3) throw new Error("Invalid previous tag or increment.");
              next[index]++;
              next.fill(0, index + 1);
              if (next.join(".") !== after) throw new Error("Prepare and merge the requested version on main first.");
            ' "$previous" "$version"
          fi
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            test "$(git rev-parse "refs/tags/v$version^{commit}")" = "$GITHUB_SHA"
          fi
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -f "head_sha=$GITHUB_SHA" \
            --jq '.total_count' | grep -Eq '^[1-9][0-9]*$'
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: corepack enable
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: yarn install --immutable
      - name: Build packages
        run: yarn build && yarn verify:esm
      - name: Pack the coordinated release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ngpel-release"
          for manifest in libs/*/package.json; do
            dist="./${manifest%/package.json}/dist"
            node -e '
              const source = require("./" + process.argv[1]);
              const packed = require(process.argv[2] + "/package.json");
              if (packed.name !== source.name || !packed.name.startsWith("@pixel-brewery/ngpel-") ||
                  packed.version !== process.env.RELEASE_VERSION || packed.version !== source.version) {
                throw new Error("Unexpected name or version in " + process.argv[2]);
              }
            ' "$manifest" "$dist"
            (cd "$dist" && npm pack --offline --ignore-scripts --pack-destination "$RUNNER_TEMP/ngpel-release")
          done
          cd "$RUNNER_TEMP/ngpel-release"
          sha256sum -- *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ngpel-release-${{ github.run_id }}
          path: ${{ runner.temp }}/ngpel-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-main
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@pixel-brewery'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ngpel-release-${{ github.run_id }}
          path: ${{ runner.temp }}/ngpel-release
      - name: Recheck the public repository and release revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq 'select(.id == 1447827206) | .visibility')" = public
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Publish and verify the built tarballs
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          registry=https://npm.pkg.github.com
          cd "$RUNNER_TEMP/ngpel-release"
          sha256sum -c SHA256SUMS
          shopt -s nullglob
          tarballs=(./*.tgz)
          test "${#tarballs[@]}" -gt 0
          pending=()
          for tarball in "${tarballs[@]}"; do
            package=$(tar -xOf "$tarball" package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0)).name')
            integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
            if remote=$(npm view "$package@$RELEASE_VERSION" dist.integrity --registry="$registry" 2>"$RUNNER_TEMP/npm-view.log"); then
              if [ -z "$remote" ]; then
                pending+=("$tarball")
              elif [ "$remote" != "$integrity" ]; then
                echo "A different tarball already exists for $package@$RELEASE_VERSION." >&2
                exit 1
              fi
            elif grep -Eq 'code (E404|ETARGET)$' "$RUNNER_TEMP/npm-view.log"; then
              pending+=("$tarball")
            else
              cat "$RUNNER_TEMP/npm-view.log" >&2
              exit 1
            fi
          done
          if [ "${pending[0]+present}" = present ]; then
            for tarball in "${pending[@]}"; do
              npm publish "$tarball" --access public --ignore-scripts --registry="$registry"
            done
          fi
          mkdir -p "$RUNNER_TEMP/verified-packages"
          for tarball in "${tarballs[@]}"; do
            package=$(tar -xOf "$tarball" package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0)).name')
            npm pack "$package@$RELEASE_VERSION" --ignore-scripts --registry="$registry" \
              --pack-destination "$RUNNER_TEMP/verified-packages"
            cmp "$tarball" "$RUNNER_TEMP/verified-packages/$(basename "$tarball")"
          done

  announce:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      packages: read
    steps:
      - name: Require public packages before announcing the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq 'select(.id == 1447827206) | .visibility')" = public
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          for package in core forms mvp router ui; do
            if [ "$(gh api "orgs/$GITHUB_REPOSITORY_OWNER/packages/npm/ngpel-$package" --jq .visibility)" != public ]; then
              echo "Set ngpel-$package to Public in GitHub Packages, then rerun this job." >&2
              exit 1
            fi
          done
          tag="v$RELEASE_VERSION"
          if git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$tag" >/dev/null; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$GITHUB_SHA"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
          fi
