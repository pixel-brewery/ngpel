# cspell:ignore ETARGET nullglob pipefail shopt
name: Release ngpel packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      specifier:
        description: Version increment
        type: choice
        default: patch
        options: [patch, minor, major]
      version:
        description: Exact next version, if supplied
        type: string
      source_sha:
        description: Expected main commit for an automatic release request
        type: string

permissions: {}

concurrency:
  group: ngpel-publication
  cancel-in-progress: false

env:
  HUSKY: '0'
  NX_DAEMON: 'false'
  NX_PARALLEL: '1'

jobs:
  source:
    name: Classify the exact release source
    if: >-
      ${{ github.repository == 'pixel-brewery/ngpel' && github.repository_id == '1447827206' &&
          github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      releaseRequired: ${{ steps.source.outputs.releaseRequired }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Retain one source-bound candidate after a metadata merge
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_MODE: classify
        run: node infra/nx-plugins/src/executors/release/runReleaseAutomation.mjs

  prepare:
    needs: source
    if: needs.source.outputs.releaseRequired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      version: ${{ steps.candidate.outputs.version }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require the triggering commit to remain on main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test -z "$EXPECTED_SOURCE_SHA" || test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - run: corepack enable
      - name: Install dependencies and prepare the coordinated version
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_SPECIFIER: ${{ inputs.specifier || 'patch' }}
        run: |
          set -euo pipefail
          yarn install --immutable
          args=()
          if [ -z "$(git tag --merged HEAD --list 'v[0-9]*')" ]; then
            args+=(--first-release)
          fi
          specifier=${REQUESTED_VERSION:-$RELEASE_SPECIFIER}
          if [[ ! "$specifier" =~ ^(patch|minor|major|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo 'Expected patch, minor, major or an exact stable version.' >&2
            exit 1
          fi
          yarn release:nx "$specifier" "${args[@]}"
          yarn install --immutable
      - name: Verify the versioned source and built packages
        env:
          NGPEL_TEST_JOBS: '2'
        run: yarn verify:ci
      - name: Bind the verified packages to the release commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: prepare
          RELEASE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/ngpel-release
        run: node infra/nx-plugins/src/executors/release/runReleaseAutomation.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ngpel-release-${{ github.run_id }}
          path: ${{ runner.temp }}/ngpel-release/
          if-no-files-found: error
          retention-days: 7

  metadata:
    name: Integrate protected release metadata
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      publicationSha: ${{ steps.integrate.outputs.publicationSha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ngpel-release-${{ github.run_id }}
          path: ${{ runner.temp }}/ngpel-release
      - name: Integrate the one verified artifact through full protected CI
        id: integrate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: integrate
          RELEASE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/ngpel-release
        run: node infra/nx-plugins/src/executors/release/runReleaseAutomation.mjs
      - name: Metadata verification remains pending
        if: steps.integrate.outputs.status == 'waiting'
        run: exit 1
      - name: Require the actual verified metadata merge
        if: steps.integrate.outputs.status != 'integrated'
        run: exit 1

  publish:
    needs:
      - prepare
      - metadata
      - continue-publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-main
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@pixel-brewery'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ngpel-release-${{ github.run_id }}
          path: ${{ runner.temp }}/ngpel-release
      - name: Verify the canonical repository, release commit and tarball bytes
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq 'select(.id == 1447827206) | .visibility')" = public
          release=$(RELEASE_MODE=verify RELEASE_ARTIFACT_DIRECTORY="$RUNNER_TEMP/ngpel-release" PUBLICATION_SHA="${{ needs.metadata.outputs.publicationSha }}" node infra/nx-plugins/src/executors/release/runReleaseAutomation.mjs)
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$release" >> "$GITHUB_OUTPUT"
      - name: Check registry versions and publish the verified tarballs
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registry=https://npm.pkg.github.com
          cd "$RUNNER_TEMP/ngpel-release"
          shopt -s nullglob
          tarballs=(./*.tgz)
          test "${#tarballs[@]}" -gt 0
          pending=()
          for tarball in "${tarballs[@]}"; do
            package=$(tar -xOf "$tarball" package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0)).name')
            [[ "$package" == @pixel-brewery/ngpel-* ]]
            test "${tarball#./}" = "pixel-brewery-${package#@pixel-brewery/}-$RELEASE_VERSION.tgz"
            test "$(tar -xOf "$tarball" package/package.json | jq -r .version)" = "$RELEASE_VERSION"
            integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
            if remote=$(npm view "$package@$RELEASE_VERSION" dist.integrity --registry="$registry" 2>"$RUNNER_TEMP/npm-view.log"); then
              if [ -z "$remote" ]; then
                pending+=("$tarball")
              elif [ "$remote" != "$integrity" ]; then
                echo "A different tarball already exists for $package@$RELEASE_VERSION." >&2
                exit 1
              fi
            elif grep -Eq 'code (E404|ETARGET)$' "$RUNNER_TEMP/npm-view.log"; then
              pending+=("$tarball")
            else
              cat "$RUNNER_TEMP/npm-view.log" >&2
              exit 1
            fi
          done
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          tag="v$RELEASE_VERSION"
          remote_tag=$(git -C "$GITHUB_WORKSPACE" ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          test "$main" = "$RELEASE_COMMIT"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin main
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)" = "$RELEASE_COMMIT"
          if [ -z "$remote_tag" ]; then
            auth=$(printf 'x-access-token:%s' "$RELEASE_PUSH_TOKEN" | base64 -w0)
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              git -C "$GITHUB_WORKSPACE" push origin "$RELEASE_COMMIT:refs/tags/$tag"
          else
            test "$main" = "$RELEASE_COMMIT"
            test "$remote_tag" = "$RELEASE_COMMIT"
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_COMMIT"
          if [ "${pending[0]+present}" = present ]; then
            for tarball in "${pending[@]}"; do
              npm publish "$tarball" --access public --ignore-scripts --registry="$registry"
            done
          fi
          mkdir -p "$RUNNER_TEMP/verified-packages"
          for tarball in "${tarballs[@]}"; do
            package=$(tar -xOf "$tarball" package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0)).name')
            npm pack "$package@$RELEASE_VERSION" --ignore-scripts --registry="$registry" \
              --pack-destination "$RUNNER_TEMP/verified-packages"
            cmp "$tarball" "$RUNNER_TEMP/verified-packages/$(basename "$tarball")"
          done

      - name: Announce the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$RELEASE_COMMIT"
          cd "$RUNNER_TEMP/ngpel-release"
          shopt -s nullglob
          tarballs=(./*.tgz)
          test "${#tarballs[@]}" -gt 0
          for tarball in "${tarballs[@]}"; do
            package=$(tar -xOf "$tarball" package/package.json | jq -er '.name | sub("^@pixel-brewery/"; "")')
            test "$(gh api "orgs/$GITHUB_REPOSITORY_OWNER/packages/npm/$package" --jq .visibility)" = public
          done
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes="$RUNNER_TEMP/ngpel-release-notes.md"
            git -C "$GITHUB_WORKSPACE" show "$RELEASE_COMMIT:CHANGELOG.md" |
              awk -v version="$RELEASE_VERSION" '$1 == "##" { if (found) exit; if ($2 == version) { found = 1; next } } found { print }' > "$notes"
            test -s "$notes"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --notes-file "$notes"
          fi
  authorize-metadata:
    name: Authorize original metadata native CI
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ngpel-release-${{ github.run_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ngpel-release
      - name: Authorize only the native CI bound to the original verified bundle and archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: authorize
          RELEASE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/ngpel-release
        run: node infra/nx-plugins/src/executors/release/runReleaseAutomation.mjs
  continue-publication:
    name: Continue the verified publication source
    needs:
      - prepare
      - metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ngpel-release-${{ github.run_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ngpel-release
      - name: Request existing main CI and documentation for the verified original-candidate merge
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: continue
          RELEASE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/ngpel-release
          PUBLICATION_SHA: ${{ needs.metadata.outputs.publicationSha }}
        run: node infra/nx-plugins/src/executors/release/runReleaseAutomation.mjs
