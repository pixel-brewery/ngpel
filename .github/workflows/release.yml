# cspell:ignore ETARGET nullglob pipefail shopt
name: Release ngpel packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      specifier:
        description: Version increment
        type: choice
        default: patch
        options: [patch, minor, major]
      version:
        description: Exact next version, if supplied
        type: string
      source_sha:
        description: Expected main commit for an automatic release request
        type: string

permissions: {}

concurrency:
  group: ngpel-publication
  cancel-in-progress: false

env:
  HUSKY: '0'
  NX_DAEMON: 'false'
  NX_PARALLEL: '1'

jobs:
  prepare:
    if: >-
      ${{ github.repository == 'pixel-brewery/ngpel' && github.event.repository.id == 1447827206 &&
          github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require the triggering commit to remain on main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test -z "$EXPECTED_SOURCE_SHA" || test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - run: corepack enable
      - name: Install dependencies and prepare the coordinated version
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_SPECIFIER: ${{ inputs.specifier || 'patch' }}
        run: |
          set -euo pipefail
          yarn install --immutable
          args=()
          if [ -z "$(git tag --merged HEAD --list 'v[0-9]*')" ]; then
            args+=(--first-release)
          fi
          specifier=${REQUESTED_VERSION:-$RELEASE_SPECIFIER}
          if [[ ! "$specifier" =~ ^(patch|minor|major|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo 'Expected patch, minor, major or an exact stable version.' >&2
            exit 1
          fi
          yarn release:nx "$specifier" "${args[@]}"
          yarn install --immutable
      - name: Verify the versioned source and built packages
        env:
          NGPEL_TEST_JOBS: '2'
        run: yarn verify:ci
      - name: Bind the verified packages to the release commit
        run: node .github/scripts/releaseCandidate.mjs prepare "$RUNNER_TEMP/ngpel-release" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ngpel-release-${{ github.run_id }}
          path: ${{ runner.temp }}/ngpel-release/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-main
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@pixel-brewery'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ngpel-release-${{ github.run_id }}
          path: ${{ runner.temp }}/ngpel-release
      - name: Verify the canonical repository, release commit and tarball bytes
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq 'select(.id == 1447827206) | .visibility')" = public
          release=$(node .github/scripts/releaseCandidate.mjs verify "$RUNNER_TEMP/ngpel-release" "$GITHUB_SHA")
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$release" >> "$GITHUB_OUTPUT"
      - name: Create the scoped release token when a release App is configured
        if: vars.RELEASE_APP_ID != ''
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Check registry versions and publish the verified tarballs
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUSH_TOKEN: ${{ steps.release-app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          registry=https://npm.pkg.github.com
          cd "$RUNNER_TEMP/ngpel-release"
          shopt -s nullglob
          tarballs=(./*.tgz)
          test "${#tarballs[@]}" -gt 0
          pending=()
          for tarball in "${tarballs[@]}"; do
            package=$(tar -xOf "$tarball" package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0)).name')
            [[ "$package" == @pixel-brewery/ngpel-* ]]
            test "${tarball#./}" = "pixel-brewery-${package#@pixel-brewery/}-$RELEASE_VERSION.tgz"
            test "$(tar -xOf "$tarball" package/package.json | jq -r .version)" = "$RELEASE_VERSION"
            integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
            if remote=$(npm view "$package@$RELEASE_VERSION" dist.integrity --registry="$registry" 2>"$RUNNER_TEMP/npm-view.log"); then
              if [ -z "$remote" ]; then
                pending+=("$tarball")
              elif [ "$remote" != "$integrity" ]; then
                echo "A different tarball already exists for $package@$RELEASE_VERSION." >&2
                exit 1
              fi
            elif grep -Eq 'code (E404|ETARGET)$' "$RUNNER_TEMP/npm-view.log"; then
              pending+=("$tarball")
            else
              cat "$RUNNER_TEMP/npm-view.log" >&2
              exit 1
            fi
          done
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          tag="v$RELEASE_VERSION"
          remote_tag=$(git -C "$GITHUB_WORKSPACE" ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [ "$main" = "$GITHUB_SHA" ] && [ -z "$remote_tag" ]; then
            auth=$(printf 'x-access-token:%s' "$RELEASE_PUSH_TOKEN" | base64 -w0)
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              git -C "$GITHUB_WORKSPACE" push --atomic origin "$RELEASE_COMMIT:refs/heads/main" "$RELEASE_COMMIT:refs/tags/$tag"
          else
            test "$main" = "$RELEASE_COMMIT"
            test "$remote_tag" = "$RELEASE_COMMIT"
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_COMMIT"
          if [ "${pending[0]+present}" = present ]; then
            for tarball in "${pending[@]}"; do
              npm publish "$tarball" --access public --ignore-scripts --registry="$registry"
            done
          fi
          mkdir -p "$RUNNER_TEMP/verified-packages"
          for tarball in "${tarballs[@]}"; do
            package=$(tar -xOf "$tarball" package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0)).name')
            npm pack "$package@$RELEASE_VERSION" --ignore-scripts --registry="$registry" \
              --pack-destination "$RUNNER_TEMP/verified-packages"
            cmp "$tarball" "$RUNNER_TEMP/verified-packages/$(basename "$tarball")"
          done

      - name: Announce the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$RELEASE_COMMIT"
          cd "$RUNNER_TEMP/ngpel-release"
          shopt -s nullglob
          tarballs=(./*.tgz)
          test "${#tarballs[@]}" -gt 0
          for tarball in "${tarballs[@]}"; do
            package=$(tar -xOf "$tarball" package/package.json | jq -er '.name | sub("^@pixel-brewery/"; "")')
            test "$(gh api "orgs/$GITHUB_REPOSITORY_OWNER/packages/npm/$package" --jq .visibility)" = public
          done
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes="$RUNNER_TEMP/ngpel-release-notes.md"
            git -C "$GITHUB_WORKSPACE" show "$RELEASE_COMMIT:CHANGELOG.md" |
              awk -v version="$RELEASE_VERSION" '$1 == "##" { if (found) exit; if ($2 == version) { found = 1; next } } found { print }' > "$notes"
            test -s "$notes"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --notes-file "$notes"
          fi
