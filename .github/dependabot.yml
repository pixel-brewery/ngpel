# Green Dependabot pull requests merge automatically: .github/workflows/dependabot-merge.yml
# cspell:ignore wortlaut
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    rebase-strategy: auto
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      angular-updates:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', angular-eslint]
      nx-updates:
        patterns: ['@nx/*', nx]
      vitest-updates:
        patterns: [vitest, '@vitest/*']
      pixel-brewery-mosaik:
        patterns: ['@pixel-brewery/mosaik-*', '@pixel-brewery/markdowner-core']
      pixel-brewery-platform:
        patterns: ['@pixel-brewery/archipel-*']
      pixel-brewery-synapse:
        patterns: ['@pixel-brewery/synapse-*']
      pixel-brewery-wortlaut:
        patterns: ['@pixel-brewery/wortlaut-*']

  - package-ecosystem: github-actions
    directory: /
    rebase-strategy: auto
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions-updates:
        patterns: ['*']
